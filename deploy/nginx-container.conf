# Include from the nginx http {} context, e.g. /etc/nginx/conf.d/printlab.conf.
# Replace printlab.example.com and certificate paths before enabling.
limit_req_zone $binary_remote_addr zone=printlab_calculations:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=printlab_catalog:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=printlab_clients:10m;
limit_conn_zone $server_name zone=printlab_total:1m;

server {
    listen 80;
    server_name printlab.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://printlab.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name printlab.example.com;
    ssl_certificate /etc/letsencrypt/live/printlab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/printlab.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 16m;
    client_body_timeout 20s;
    limit_conn printlab_clients 8;
    limit_conn printlab_total 100;
    limit_conn_status 429;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 200s;
    proxy_send_timeout 30s;
    # Buffer uploads before passing them to the API; never retry a calculation.
    proxy_request_buffering on;
    proxy_next_upstream off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 429 = @busy;
    error_page 413 = @too_large;

    location @busy {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 10 always;
        return 429 '{"code":"SLICER_BUSY","message":"Слишком много запросов. Повторите попытку позже."}';
    }

    location @too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 413 '{"code":"FILE_TOO_LARGE","message":"Размер STL не должен превышать 15 МиБ."}';
    }

    location = /api/materials {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=printlab_catalog burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/print-plans/analyze-stl {
        if ($request_method != POST) { return 405; }
        limit_req zone=printlab_calculations burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/optimization/analyze-stl {
        if ($request_method != POST) { return 405; }
        limit_req zone=printlab_calculations burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # Public access is granted only to the exact API routes above.
    location = /api { return 404; }
    location /api/ { return 404; }
    location ~ ^/(swagger-ui|v3/api-docs|actuator)(/|\.|$) { return 404; }
    location ~ /\. { return 404; }

    # The frontend container owns static assets and SPA fallback.
    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
