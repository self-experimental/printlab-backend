# Temporary HTTP configuration for obtaining the first HTTPS certificate.
# Include from nginx http {}. Replace the hostname before enabling.
# Replace with nginx.conf after certificate issuance.
server {
    listen 80;
    server_name printlab.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "PrintLab is being prepared. Please try again shortly.\n";
    }
}
