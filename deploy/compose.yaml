name: printlab
services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable image reference}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 5g
    cpus: 3
    stop_grace_period: 210s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      PRINTLAB_SLICING_JOB_TIMEOUT_SECONDS: "180"
      PRINTLAB_SLICING_PROCESS_TIMEOUT_SECONDS: "45"
      PRINTLAB_SLICING_NATIVE_TIMEOUT_SECONDS: "40"
      PRINTLAB_RECOMMENDATIONS_ENABLED: "true"
      PRINTLAB_OLLAMA_URL: "http://ollama:11434"
      PRINTLAB_OLLAMA_MODEL: "qwen3:1.7b"
      PRINTLAB_REQUIREMENTS_MODEL: "qwen2.5:7b-instruct-q3_K_M"
      PRINTLAB_RECOMMENDATIONS_TIMEOUT_SECONDS: "25"
      PRINTLAB_REQUIREMENTS_TIMEOUT_SECONDS: "90"
    volumes:
      - data:/var/lib/printlab
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable image reference}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16777216,mode=1777
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  ollama:
    image: ollama/ollama@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    platform: linux/amd64
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 4352m
    cpus: 3
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama:/root/.ollama
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
volumes:
  data:
    external: true
    name: ${DATA_VOLUME:-printlab-data}
  ollama:
    external: true
    name: printlab-ollama
