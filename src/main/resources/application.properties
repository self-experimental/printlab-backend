spring.application.name=printlab-backend

# каталог для JSON-хранилища на этапе MVP
printlab.data.dir=./data

# Versioned material evidence; optional file: URI for an externally curated catalog.
printlab.materials.resource=${PRINTLAB_MATERIALS_RESOURCE:classpath:catalog/materials.json}

printlab.bambu.executable=${PRINTLAB_BAMBU_EXECUTABLE:/Applications/BambuStudio.app/Contents/MacOS/BambuStudio}
printlab.bambu.profiles=${PRINTLAB_BAMBU_PROFILES:/Applications/BambuStudio.app/Contents/Resources/profiles/BBL}

# Keep native work bounded and leave headroom for process termination and HTTP delivery.
printlab.slicing.job-timeout-seconds=${PRINTLAB_SLICING_JOB_TIMEOUT_SECONDS:180}
printlab.slicing.process-timeout-seconds=${PRINTLAB_SLICING_PROCESS_TIMEOUT_SECONDS:45}
printlab.slicing.native-timeout-seconds=${PRINTLAB_SLICING_NATIVE_TIMEOUT_SECONDS:40}

# Self-hosted classification; no API key and no external text/CAD transfer.
printlab.recommendations.enabled=${PRINTLAB_RECOMMENDATIONS_ENABLED:false}
printlab.recommendations.ollama-url=${PRINTLAB_OLLAMA_URL:http://127.0.0.1:11434}
printlab.recommendations.model=${PRINTLAB_REQUIREMENTS_MODEL:${PRINTLAB_OLLAMA_MODEL:qwen2.5:7b-instruct-q3_K_M}}
printlab.recommendations.timeout-seconds=${PRINTLAB_REQUIREMENTS_TIMEOUT_SECONDS:${PRINTLAB_RECOMMENDATIONS_TIMEOUT_SECONDS:90}}

# ограничение размера загружаемого STL
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
spring.servlet.multipart.file-size-threshold=0

# Original files and metadata; separate from tracked experiment fixtures.
printlab.models.dir=${PRINTLAB_MODELS_DIR:./data/uploads}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
